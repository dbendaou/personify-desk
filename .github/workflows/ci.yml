name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux-tests:
    name: Swift tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift 6.4
        run: bash scripts/install-swift-linux.sh
      - name: Test
        run: bash -lc '. "$HOME/.local/share/swiftly/env.sh" && make test'

  macos-app:
    name: macOS build, test, and codesign
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift 6.4
        run: bash scripts/select-swift-macos.sh
      - name: Test
        run: make test
      - name: Build and sign
        run: make app
      - name: Verify signature
        run: codesign --verify --deep --strict dist/PersonifyDesk.app
